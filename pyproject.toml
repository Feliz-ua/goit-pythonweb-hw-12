[project]
name = "goit-pythonweb-hw-10"
version = "0.1.0"
description = "Contacts REST API"
authors = [
    {name = "Yevhen Petrov"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "cloudinary (>=1.46.2,<2.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "ruff (>=0.16.9,<0.17.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I", "B", "DTZ", "SIM", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["DTZ011"]